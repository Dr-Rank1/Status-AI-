name: status
description: Social media simulation with AI-driven fictional characters.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  socket_io_client: ^3.0.2
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.4.0
  flutter_dotenv: ^5.2.1
  flutter_ai_assistant: ^0.2.0
  record: ^5.2.1
  flutter_tts: ^4.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4
  flutter_3d_controller: ^2.3.0
  simli_flutter: ^0.0.2
  livekit_client: ^2.3.6
  rive: ^0.13.20
  path_provider: ^2.1.5
  flutter_local_ai: ^0.0.16
  speech_to_text: ^7.0.0
  sqflite: ^2.4.1
  path: ^1.9.0
  dbus: ^0.7.11
  tray_manager: ^0.5.0
  window_manager: ^0.4.3
  desktop_multi_window: ^0.2.1
  posthog_flutter: ^4.11.0
  sentry_flutter: ^8.14.2
  device_info_plus: ^11.3.0
  package_info_plus: ^8.3.0
  cryptography: ^2.7.0
  ffi: ^2.1.3
  flutter_blue_plus: ^1.35.5
  just_audio: ^0.9.46
  purchases_flutter: ^8.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    - assets/avatars/
    - .env.example

flutter_native_splash:
  color: "#0f0f14"
  image: assets/branding/app_icon.png
  android_12:
    color: "#0f0f14"
    image: assets/branding/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0f0f14"
  adaptive_icon_foreground: assets/branding/app_icon.png
