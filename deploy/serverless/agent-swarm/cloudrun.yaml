# Phase 34 — Google Cloud Run agent swarm (scale-to-zero)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: status-agent-swarm
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "200"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/PROJECT_ID/status-agent-swarm:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: MCP_PROTOCOL_VERSION
              value: "2026-07-28"
            - name: MCP_SWARM_BACKEND
              value: "local"
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: production
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 10
---
# Deploy:
#   gcloud run services replace deploy/serverless/agent-swarm/cloudrun.yaml
# Or:
#   gcloud run deploy status-agent-swarm --source deploy/serverless/agent-swarm \
#     --min-instances=0 --max-instances=200 --cpu-throttling
