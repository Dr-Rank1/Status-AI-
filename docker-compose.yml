services:
  db:
    image: postgres:16-alpine
    container_name: status-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: status
    ports:
      - "5432:5432"
    volumes:
      - status_pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d status"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  status_pgdata:
